name: CI

# Executa em pushes para main/develop e em pull requests para main.
# Fluxo: verificar-pwa (testes + lint) → verificar-api → build-imagens
# Cada etapa usa os mesmos scripts locais que os desenvolvedores executam
# antes de commitar (check-pwa.sh e check-api.sh).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write   # necessário para push de imagens ao GHCR (build-imagens)

jobs:
  # ---------------------------------------------------------------------------
  # Validação do contrato de gates: impede regressão que torne um check
  # obrigatório apenas informativo ou remova uma dependência do gate agregado.
  # ---------------------------------------------------------------------------
  validar-ci:
    name: "Validar bloqueio da CI"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"

      - name: Executar teste do contrato de gates
        run: npm run test:ci

  # ---------------------------------------------------------------------------
  # Verificação da PWA: versao.sh verificar + testes Angular (Vitest) + lint
  # Espelho do ./infra/scripts/check-pwa.sh
  # ---------------------------------------------------------------------------
  verificar-pwa:
    name: "Verificar PWA"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar relatório de falha
        run: mkdir -p "$RUNNER_TEMP/ci-reports/verificar-pwa"

      - name: Configurar Node.js 22.23.2
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: apps/pwa/package-lock.json

      - name: Instalar dependências da PWA
        working-directory: apps/pwa
        run: |
          set -o pipefail
          npm ci --prefer-offline 2>&1 | tee "$RUNNER_TEMP/ci-reports/verificar-pwa/npm-ci.log"

      - name: Executar check:pwa
        run: |
          set -o pipefail
          npm run check:pwa 2>&1 | tee "$RUNNER_TEMP/ci-reports/verificar-pwa/check-pwa.log"

      - name: Executar lint da PWA
        working-directory: apps/pwa
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee "$RUNNER_TEMP/ci-reports/verificar-pwa/lint.log"

      - name: Publicar relatório de falha da PWA
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-falha-verificar-pwa-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-reports/verificar-pwa/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Verificação da API: versao.sh verificar + mvnw verify
  # Espelho do ./infra/scripts/check-api.sh
  # Docker disponível nos runners ubuntu-latest (necessário para Testcontainers)
  # ---------------------------------------------------------------------------
  verificar-api:
    name: "Verificar API"
    runs-on: ubuntu-latest
    # O QuarkusIntegrationTest inicia a aplicação empacotada em modo prod,
    # portanto o Flyway precisa de um PostgreSQL real durante o verify.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: satoshi_pet
          POSTGRES_USER: satoshi
          # O banco efêmero do CI aceita conexões locais sem senha.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U satoshi -d satoshi_pet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: satoshi_pet
      POSTGRES_USER: satoshi
      # O serviço usa trust; a API recebe a variável explicitamente sem
      # manter qualquer senha literal na configuração versionada.
      POSTGRES_PASSWORD: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar relatório de falha
        run: mkdir -p "$RUNNER_TEMP/ci-reports/verificar-api"

      - name: Configurar Java 25 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
          cache-dependency-path: services/api/pom.xml

      - name: Permissão no Maven Wrapper
        working-directory: services/api
        run: chmod +x mvnw

      - name: Executar check:api
        run: |
          set -o pipefail
          npm run check:api 2>&1 | tee "$RUNNER_TEMP/ci-reports/verificar-api/check-api.log"

      - name: Publicar relatório de falha da API
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-falha-verificar-api-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ci-reports/verificar-api/
            services/api/target/surefire-reports/
            services/api/target/failsafe-reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build das imagens Docker da PWA e da API
  # Executa apenas após ambas as verificações passarem.
  # As imagens são tagueadas com a versão do produto (X.Y.Z).
  # Em PRs: build only (push: false). Em pushes para main: push para GHCR.
  # ---------------------------------------------------------------------------
  build-imagens:
    name: "Build imagens Docker"
    runs-on: ubuntu-latest
    needs: [verificar-pwa, verificar-api]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar relatório de falha
        run: mkdir -p "$RUNNER_TEMP/ci-reports/build-imagens"

      - name: Extrair versão do produto
        id: versao
        run: |
          VERSION=$(node -p "require('./apps/pwa/package.json').version")
          echo "versao=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão do produto: ${VERSION}"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Imagem da PWA Angular
      # -----------------------------------------------------------------------
      - name: "Build imagem PWA"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/pwa/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/satoshi-pet-pwa:${{ steps.versao.outputs.versao }}
            ghcr.io/${{ github.repository_owner }}/satoshi-pet-pwa:latest
          # Cache por camada — acelera builds em PRs e pushes subsequentes
          cache-from: type=gha,scope=pwa
          cache-to:   type=gha,scope=pwa,mode=max
          provenance: false

      # -----------------------------------------------------------------------
      # Imagem da API Quarkus
      # -----------------------------------------------------------------------
      - name: "Build imagem API"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/satoshi-pet-api:${{ steps.versao.outputs.versao }}
            ghcr.io/${{ github.repository_owner }}/satoshi-pet-api:latest
          cache-from: type=gha,scope=api
          cache-to:   type=gha,scope=api,mode=max
          provenance: false

      - name: Resumo do build
        if: always()
        run: |
          echo "## Imagens Docker" >> "$GITHUB_STEP_SUMMARY"
          echo "| Imagem | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| satoshi-pet-pwa | ${{ steps.versao.outputs.versao }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| satoshi-pet-api | ${{ steps.versao.outputs.versao }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar contexto seguro da falha do build
        if: ${{ failure() }}
        run: |
          {
            echo "Workflow: ${GITHUB_WORKFLOW}"
            echo "Execução: ${GITHUB_RUN_ID}"
            echo "Evento: ${GITHUB_EVENT_NAME}"
            echo "Ref: ${GITHUB_REF}"
            echo "Commit: ${GITHUB_SHA}"
            echo "O diagnóstico detalhado permanece nos logs das etapas do GitHub Actions."
          } > "$RUNNER_TEMP/ci-reports/build-imagens/contexto.txt"

      - name: Publicar relatório de falha do build
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-falha-build-imagens-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-reports/build-imagens/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Check único a ser configurado como obrigatório na proteção de main.
  # always() faz o job observar falhas/skips dos predecessores; o script
  # converte qualquer resultado diferente de success em falha explícita.
  # Enquanto uma dependência estiver pendente, este check permanece pendente.
  # ---------------------------------------------------------------------------
  gate-obrigatorio:
    name: "Gate obrigatório"
    if: ${{ always() }}
    needs: [validar-ci, verificar-pwa, verificar-api, build-imagens]
    runs-on: ubuntu-latest
    env:
      CI_VALIDAR_RESULT: ${{ needs.validar-ci.result }}
      CI_VERIFICAR_PWA_RESULT: ${{ needs.verificar-pwa.result }}
      CI_VERIFICAR_API_RESULT: ${{ needs.verificar-api.result }}
      CI_BUILD_IMAGENS_RESULT: ${{ needs.build-imagens.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar resultados dos checks obrigatórios
        run: node infra/scripts/ci-gate.mjs
