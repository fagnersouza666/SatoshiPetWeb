server {
    listen 80;
    listen [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # CSP também é aplicada quando o nginx é acessado diretamente, sem Caddy.
    # Os locations abaixo repetem o header quando definem add_header próprio,
    # pois o nginx deixa de herdar add_header do bloco pai nesse caso.
    set $csp_policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; media-src 'self'; connect-src 'self' wss:; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp_policy always;

    # Resolver Docker — permite que nginx resolva nomes de serviços dinamicamente.
    # Necessário para que proxy_pass para "api" não falhe na inicialização do container.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---------------------------------------------------------------------------
    # Health check do próprio nginx (usado pelo Caddy ou orquestradores)
    # ---------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        add_header Content-Security-Policy $csp_policy always;
    }

    # ---------------------------------------------------------------------------
    # Proxy para a API Quarkus — funciona no contexto Docker Compose
    # Em produção com Caddy, o roteamento /api é feito pelo Caddyfile;
    # esta configuração é útil quando o nginx é acessado diretamente (porta 4200).
    # ---------------------------------------------------------------------------
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Quarkus health / métricas
    location /q/ {
        set $api_upstream http://api:8080;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ---------------------------------------------------------------------------
    # WebSocket — eventos em tempo real (Quarkus WebSocket / SSE)
    # ---------------------------------------------------------------------------
    location /ws {
        set $api_upstream http://api:8080;
        proxy_pass         $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------------------------
    # Angular SPA — todas as rotas retornam index.html (client-side routing)
    # ---------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html: sem cache para garantir atualização do service worker
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        add_header Content-Security-Policy $csp_policy always;
    }

    # ---------------------------------------------------------------------------
    # Assets estáticos com hash no nome — cache imutável de 1 ano
    # O Angular gera hashes nos nomes de arquivo na build de produção.
    # ---------------------------------------------------------------------------
    location ~* \.(js|css|mjs|woff2?|ttf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
        add_header         Content-Security-Policy $csp_policy always;
        access_log         off;
        try_files          $uri =404;
    }

    # Service worker — sem cache para garantir atualização imediata
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Content-Security-Policy $csp_policy always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Security-Policy $csp_policy always;
        try_files $uri =404;
    }
}
