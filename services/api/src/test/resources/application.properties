quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:satoshi_pet_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=sa
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-at-start=false
satoshi-pet.magic-link.ttl=PT15M
satoshi-pet.magic-link.base-url=http://localhost:8080
satoshi-pet.session.duration=PT1H

# Usa uma porta livre para permitir suites Quarkus simultâneas no workspace.
quarkus.http.test-port=0

# Mailer no modo mock (não envia e-mail em testes)
quarkus.mailer.mock=true

# Scheduler desabilitado em testes para evitar interferência
quarkus.scheduler.enabled=false
