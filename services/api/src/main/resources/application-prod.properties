# O TLS termina no proxy/ingress. Este container recebe somente HTTP interno;
# nenhum certificado ou chave privada deve ser copiado para a imagem.
# O listener interno permanece HTTP porque o proxy é o terminador TLS. A
# borda deve redirecionar HTTP público para HTTPS antes de encaminhar.
quarkus.http.insecure-requests=enabled

# Aceitar a identidade original somente do proxy configurado pela implantação.
# O proxy deve remover cabeçalhos encaminhados recebidos do cliente e gravar os
# próprios valores antes de encaminhar a requisição.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=false
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.forwarded-precedence=x-forwarded
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.strict-forwarded-control=true
quarkus.http.proxy.trusted-proxies=${QUARKUS_HTTP_PROXY_TRUSTED_PROXIES}
