quarkus.application.name=satoshi-pet-api

# O desenvolvimento local usa HTTP diretamente no container. Os perfis
# staging e prod exigem HTTPS no proxy/ingress e estão definidos nos arquivos
# application-<perfil>.properties.
quarkus.http.insecure-requests=enabled

# =============================================================================
# CORS — somente origens declaradas pela implantação
# =============================================================================
# A PWA publicada usa o proxy same-origin. O allowlist continua configurável
# para o acesso local e para instalações em hosts distintos; nunca usar '*'
# porque a sessão usa cookies.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Content-Type,Origin,X-CSRF-Token,X-Correlation-Id
quarkus.http.cors.exposed-headers=X-CSRF-Token,X-Correlation-Id
quarkus.http.cors.access-control-allow-credentials=true

# Desenvolvimento e testes acessam a API diretamente quando a PWA não passa
# pelo Caddy. A implantação pode sobrescrever CORS_ALLOWED_ORIGINS.
%dev.quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost}
%test.quarkus.http.cors.origins=http://localhost:4200,https://localhost

# =============================================================================
# Datasource — todas as credenciais vêm do ambiente (nunca hardcode em prod)
# =============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.health.enabled=true

# Flyway é a fonte do schema; o Hibernate apenas valida o banco aplicado.
quarkus.hibernate-orm.schema-management.strategy=validate

# Desenvolvimento local: o PostgreSQL fica exposto pelo Compose em localhost.
# Os valores podem ser substituídos sem alterar este arquivo.
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/satoshi_pet}
%dev.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:satoshi_pet}
%dev.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:satoshi_pet_dev}
%dev.quarkus.datasource.devservices.enabled=false

# Produção usa o nome do serviço PostgreSQL na rede do Compose por padrão.
# Credenciais não têm fallback de desenvolvimento e devem vir do ambiente.
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/satoshi_pet}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

# =============================================================================
# Flyway
# =============================================================================
# Migrations versionadas são a única origem do schema. O startup aplica todas
# as versões pendentes em banco novo, sem criar baseline artificial.
quarkus.flyway.locations=db/migration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.validate-on-migrate=true
quarkus.flyway.clean-at-start=false

# =============================================================================
# Hibernate ORM
# =============================================================================
# Flyway gerencia o schema; Hibernate não altera tabelas em runtime.

# =============================================================================
# Magic link
# O TTL deve ser fornecido por ambiente conforme DEC-02.2; não há valor padrão
# de produto nesta atividade.
# TTL padrão dev (Compose: MAGIC_LINK_TTL); produção sobrescreve por ambiente
satoshi-pet.magic-link.ttl=${MAGIC_LINK_TTL:PT15M}
# URL base para construção do link (configurável por ambiente)
satoshi-pet.magic-link.base-url=${MAGIC_LINK_BASE_URL:http://localhost:4200}
# =============================================================================

# =============================================================================
# Sessões autenticadas
# =============================================================================
# Duração da sessão (formato ISO-8601 Duration)
satoshi-pet.session.duration=${SESSION_DURATION:P30D}

# =============================================================================
# Mailer — dev: Mailpit (http://localhost:8025); prod: servidor SMTP real
# =============================================================================
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:1025}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.auth-methods=DISABLED
quarkus.mailer.from=${MAIL_FROM:noreply@satoshipet.local}

# =============================================================================
# Object Storage — MinIO (S3-compatível)
# =============================================================================
satoshi-pet.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
satoshi-pet.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
satoshi-pet.storage.secret-key=${MINIO_SECRET_KEY:minioadmin_dev}
satoshi-pet.storage.bucket=${MINIO_BUCKET:pet-artwork}
satoshi-pet.storage.staging-bucket=${MINIO_STAGING_BUCKET:pet-artwork-staging}

# =============================================================================
# Health & Métricas
# =============================================================================
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# =============================================================================
# WebSocket Next
# =============================================================================
# Timeout de inatividade para conexões WebSocket (supera heartbeat de 30s)
quarkus.websockets-next.server.idle-timeout=90S

# =============================================================================
# Bitcoin Indexer — Esplora (Blockstream API)
# =============================================================================
quarkus.rest-client.esplora.url=${ESPLORA_URL:https://blockstream.info/api}
satoshi-pet.bitcoin.esplora-url=${ESPLORA_URL:https://blockstream.info/api}
