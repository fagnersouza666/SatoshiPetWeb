# Composição inicial do desenvolvimento local.
# Serviços de dados e Bitcoin de teste entram pelas entregas específicas do
# backlog e não devem ser simulados ou substituídos por Mainnet.

services:
  pwa:
    build:
      context: ..
      dockerfile: apps/pwa/Dockerfile
    depends_on:
      - api
    ports:
      - "${PWA_PORT:-4200}:80"

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-satoshi_pet}"
      QUARKUS_DATASOURCE_USERNAME: "${POSTGRES_USER:-satoshi_pet}"
      QUARKUS_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-satoshi_pet_dev}"
    ports:
      - "${API_PORT:-8080}:8080"

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-satoshi_pet}"
      POSTGRES_USER: "${POSTGRES_USER:-satoshi_pet}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-satoshi_pet_dev}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  minio-data:
  postgres-data:
